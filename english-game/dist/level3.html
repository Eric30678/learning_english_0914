<script>
/* ───── timed-mode.js ───── */
/* ═══════════════════════════════════════════════════════
   timed-mode.js — 限時模式（第三～五級故事、原本閱讀共用）

   三段難度，時間越來越短：
     普通：每分鐘 100 字，一頁 30～45 秒，每題 40 秒
     中等：每分鐘 150 字，一頁 20～30 秒，每題 30 秒
     困難：每分鐘 200 字，一頁 15～20 秒，每題 25 秒
   每頁時間 = 本頁字數 ÷ 閱讀速度，再限制在該難度的秒數範圍內。

   設定存在 localStorage 'pxtimed.v1'，所有頁面共用。
   切到別的分頁時計時會暫停。
   ═══════════════════════════════════════════════════════ */
var TimedMode = (function(){
  'use strict';
  const PRESETS = {
    easy: { label:'普通', wpm:100, min:30, max:45, perQ:40 },
    mid:  { label:'中等', wpm:150, min:20, max:30, perQ:30 },
    hard: { label:'困難', wpm:200, min:15, max:20, perQ:25 }
  };
  const ORDER = ['easy','mid','hard'];
  const SKEY = 'pxtimed.v1', LKEY = 'pxtimed.v1.log';
  let memSettings = { mode:'off', auto:false }, memLog = {};
  let app = 'story', stripEl = null, controlsEl = null, onChange = null;
  let run = null, cur = null, iv = null;

  function load(){ try{ return Object.assign({mode:'off',auto:false}, JSON.parse(localStorage.getItem(SKEY)||'{}')); }catch(e){ return memSettings; } }
  function store(s){ memSettings = s; try{ localStorage.setItem(SKEY, JSON.stringify(s)); }catch(e){} }
  function loadLog(){ try{ return JSON.parse(localStorage.getItem(LKEY)||'{}'); }catch(e){ return memLog; } }
  function storeLog(l){ memLog = l; try{ localStorage.setItem(LKEY, JSON.stringify(l)); }catch(e){} }

  const settings = () => load();
  const preset = () => PRESETS[settings().mode] || null;
  const isOn = () => !!preset();
  const now = () => Date.now();
  const mmss = t => { t = Math.max(0, Math.round(t)); return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`; };
  const countWords = text => String(text||'').split(/\s+/).filter(w=>/[A-Za-z]/.test(w)).length;
  function pageLimit(words){ const p = preset(); if(!p) return 0; return Math.min(p.max, Math.max(p.min, Math.round(words/p.wpm*60))); }
  function quizFactor(){ const p = preset(); return p ? p.perQ/30 : 1; }

  /* ── 畫面 ── */
  function injectStyle(){
    if(document.getElementById('tmStyle')) return;
    const st = document.createElement('style'); st.id = 'tmStyle';
    st.textContent = `
.tm-controls{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:0 13px 11px;font-size:12px;color:#c9c0d8}
.tm-controls label{display:flex;align-items:center;gap:6px}
.tm-controls select{font-family:inherit;font-size:12px;color:#f4eae0;background:#342d49;border:2px solid #58506e;padding:6px 8px;border-radius:0}
.tm-controls input{width:16px;height:16px;accent-color:#84b8ab;margin:0}
.tm-controls .tm-rule{flex-basis:100%;font-size:11px;color:#9b93ad;line-height:1.6}
.tm-controls input:disabled+span{opacity:.45}
.tm-strip{position:sticky;top:0;z-index:5;margin:0 12px 10px;padding:8px 10px 9px;background:#1d1a2b;border:3px solid #1b1826;outline:2px solid #3a3350;color:#e8e2d6}
.tm-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tm-left{font-size:24px;line-height:28px;min-width:70px;font-variant-numeric:tabular-nums}
.tm-info{font-size:11px;line-height:1.6;color:#a79fb9;flex:1;min-width:150px}
.tm-gauge{height:8px;margin-top:7px;background:#2f2942;border:2px solid #3a3350}
.tm-gauge i{display:block;height:100%;background:#84b8ab;width:100%}
.tm-strip.warn .tm-left{color:#ffb46b}.tm-strip.warn .tm-gauge i{background:#ffb46b}
.tm-strip.over{border-color:#5a2a26}.tm-strip.over .tm-left{color:#f08a7a}.tm-strip.over .tm-gauge i{background:#f08a7a}
.tm-strip.paused .tm-left{color:#8f879e}
.tm-report{display:block;margin-top:6px;color:#e6d9b8}`;
    document.head.appendChild(st);
  }

  function renderControls(){
    if(!controlsEl) return;
    const s = settings(), p = preset();
    controlsEl.innerHTML = `<label>限時模式
        <select id="tmMode" aria-label="限時模式難度">
          <option value="off">關閉</option>
          ${ORDER.map(k=>`<option value="${k}">${PRESETS[k].label} · 每分鐘 ${PRESETS[k].wpm} 字</option>`).join('')}
        </select></label>
      <label><input type="checkbox" id="tmAuto"${s.auto?' checked':''}${p?'':' disabled'}><span>時間到自動翻頁</span></label>
      <span class="tm-rule">${p ? `每頁 ${p.min}～${p.max} 秒（依字數）、作答每題 ${p.perQ} 秒，時間到自動交卷。查單字也會計時。` : '開啟後每頁和小考都會倒數，適合讀第二遍時練速度。'}</span>`;
    const sel = controlsEl.querySelector('#tmMode'); sel.value = s.mode;
    sel.onchange = ()=>{ store(Object.assign(settings(), {mode:sel.value})); resetRun(); renderControls(); if(onChange) onChange(); };
    controlsEl.querySelector('#tmAuto').onchange = e=>{ store(Object.assign(settings(), {auto:e.target.checked})); };
  }

  function mount(opts){
    injectStyle();
    app = opts.app || app; onChange = opts.onChange || null;
    controlsEl = document.createElement('div'); controlsEl.className = 'tm-controls';
    opts.controlsAfter.after(controlsEl);
    stripEl = document.createElement('div'); stripEl.className = 'tm-strip'; stripEl.hidden = true;
    stripEl.setAttribute('role','timer');
    opts.stripBefore.before(stripEl);
    renderControls();
    document.addEventListener('visibilitychange', ()=>{
      if(!cur) return;
      if(document.hidden){ commit(); cur.paused = true; draw(); }
      else { cur.paused = false; cur.t0 = now(); }
    });
  }

  /* ── 計時 ── */
  function resetRun(){ stopTick(); run = null; cur = null; if(stripEl) stripEl.hidden = true; }
  function chapter(id){ if(!run || run.id !== id || run.finished) run = { id, mode: settings().mode, pages:{}, quiz:null, finished:false }; }
  function commit(){ if(cur && !cur.paused){ cur.rec.used += (now()-cur.t0)/1000; cur.t0 = now(); } }
  function stopTick(){ commit(); if(iv){ clearInterval(iv); iv = null; } }
  function used(){ return cur ? cur.rec.used + (cur.paused ? 0 : (now()-cur.t0)/1000) : 0; }

  function draw(){
    if(!cur || !stripEl) return;
    const r = cur.rec, u = used(), left = r.limit - u;
    stripEl.hidden = false;
    stripEl.classList.toggle('over', left < 0);
    stripEl.classList.toggle('warn', left >= 0 && left <= Math.max(5, r.limit*0.25));
    stripEl.classList.toggle('paused', !!cur.paused);
    const big = left >= 0 ? mmss(left) : '+' + mmss(-left);
    const label = preset() ? preset().label : '';
    let info;
    if(cur.type === 'quiz') info = `${label} · 作答 ${r.n} 題 × ${Math.round(r.limit/r.n)} 秒` + (left < 0 ? ' · 時間到' : ' · 時間到自動交卷');
    else if(left >= 0) info = `${label} · 本頁 ${r.words} 字 · 限時 ${r.limit} 秒`;
    else info = settings().auto ? '時間到，翻到下一頁' : `超過本頁 ${r.limit} 秒；讀完就翻頁，超時會記在成績裡`;
    if(cur.paused) info = '已暫停（離開了這個分頁）';
    stripEl.innerHTML = `<div class="tm-row"><span class="tm-left">${big}</span><span class="tm-info">${info}</span></div>
      <div class="tm-gauge"><i style="width:${Math.max(0, Math.min(1, left/r.limit))*100}%"></i></div>`;
  }

  function startTick(){
    if(iv) clearInterval(iv);
    iv = setInterval(()=>{
      draw();
      if(!cur || cur.paused || cur.fired) return;
      if(used() >= cur.rec.limit){
        if(cur.type === 'quiz'){ cur.fired = true; const cb = cur.onTimeout; cb && cb(); }
        else if(settings().auto){ cur.fired = true; const cb = cur.onTimeout; cb && cb(); }
      }
    }, 250);
  }

  function page(key, words, onTimeout){
    stopTick();
    if(!isOn() || !run){ cur = null; if(stripEl) stripEl.hidden = true; return; }
    if(run.quiz && !run.quiz.done){ cur = { type:'quiz', rec:run.quiz, t0:now(), onTimeout:run.quiz.onTimeout }; draw(); startTick(); return; }
    const rec = run.pages[key] || (run.pages[key] = { words, limit:pageLimit(words), used:0 });
    cur = { type:'page', rec, t0:now(), onTimeout, fired: rec.used >= rec.limit };
    draw(); startTick();
  }

  function quiz(n, onTimeout){
    stopTick();
    if(!isOn() || !run){ cur = null; if(stripEl) stripEl.hidden = true; return; }
    if(!run.quiz || run.quiz.done) run.quiz = { n, limit: n*preset().perQ, used:0, done:false, onTimeout };
    cur = { type:'quiz', rec:run.quiz, t0:now(), onTimeout };
    draw(); startTick();
  }

  function leave(){ stopTick(); cur = null; if(stripEl) stripEl.hidden = true; }

  /* 結束一章：停止計時，回傳這章的限時結果（沒開限時則回傳 null） */
  function finish(){
    stopTick(); cur = null; if(stripEl) stripEl.hidden = true;
    if(!run || !PRESETS[run.mode]) return null;
    run.finished = true;
    const pages = Object.values(run.pages);
    const words = pages.reduce((a,p)=>a+p.words, 0), secs = pages.reduce((a,p)=>a+p.used, 0);
    return {
      id: run.id, mode: run.mode, pages: pages.length, words, secs,
      wpm: secs > 0 ? Math.round(words/secs*60) : 0,
      over: pages.filter(p=>p.used > p.limit + 0.5).length,
      quiz: run.quiz ? { n:run.quiz.n, used:Math.min(run.quiz.used, run.quiz.limit), limit:run.quiz.limit, timedOut:run.quiz.used >= run.quiz.limit } : null
    };
  }

  /* 把結果寫成一段話，並和上次同難度的紀錄比較 */
  function report(sum, right, total){
    if(!sum) return '';
    const p = PRESETS[sum.mode], parts = [];
    if(sum.pages){
      parts.push(`限時閱讀（${p.label}）：${sum.pages} 頁共 ${sum.words} 字，用了 ${mmss(sum.secs)}，約每分鐘 ${sum.wpm} 字` + (sum.over ? `，${sum.over} 頁超時。` : '，每頁都在時間內。'));
    }
    if(sum.quiz){
      parts.push(sum.quiz.timedOut ? `作答時間到（${mmss(sum.quiz.limit)}），沒作答的題目算錯。` : `作答用了 ${mmss(sum.quiz.used)}，限時 ${mmss(sum.quiz.limit)}。`);
    }
    const log = loadLog(), k = `${app}:${sum.id}:${sum.mode}`, prev = log[k];
    if(prev && prev.wpm && sum.wpm) parts.push(`上次同難度每分鐘 ${prev.wpm} 字，這次 ${sum.wpm >= prev.wpm ? '進步' : '慢了'} ${Math.abs(sum.wpm - prev.wpm)} 字。`);
    if(sum.pages){ log[k] = { wpm:sum.wpm, over:sum.over, right, total, at:new Date().toISOString().slice(0,10) }; storeLog(log); }
    const idx = ORDER.indexOf(sum.mode);
    const good = total ? right/total >= 0.8 : true;
    if(sum.pages && !sum.over && good && !(sum.quiz && sum.quiz.timedOut)){
      parts.push(idx < ORDER.length-1 ? `這個難度很穩，連續幾章都這樣就可以換「${PRESETS[ORDER[idx+1]].label}」。` : '已經是多益的閱讀速度，繼續保持答對率。');
    } else if(sum.pages && total && !good){
      parts.push('答對率偏低時，先維持這個難度，把速度放慢一點。');
    }
    return parts.join('');
  }

  return { PRESETS, mount, isOn, settings, countWords, pageLimit, quizFactor, chapter, page, quiz, leave, finish, report, mmss };
})();

</script>

function setSaved(o){sessionSaved=o;try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function nextDate(){let d=new Date();d.setDate(d.getDate()+1);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function lemma(raw){const w=raw.toLowerCase();if(bank[w])return w;
  const cand=[];if(w.endsWith('ies'))cand.push(w.slice(0,-3)+'y');if(w.endsWith('ied'))cand.push(w.slice(0,-3)+'y');if(w.endsWith('ing'))cand.push(w.slice(0,-3),w.slice(0,-3)+'e');if(w.endsWith('ed'))cand.push(w.slice(0,-2),w.slice(0,-1));if(w.endsWith('es'))cand.push(w.slice(0,-2),w.slice(0,-1));if(w.endsWith('s'))cand.push(w.slice(0,-1));return cand.find(x=>bank[x])||null}
function chapterWord(w){return c().words.includes(w)||LEVEL3_STORIES.slice(0,chapter).some(s=>s.words.includes(w))}
function glossKey(raw,dict){const w=raw.toLowerCase();if(dict[w])return w;const cand=[];if(w.endsWith('ies'))cand.push(w.slice(0,-3)+'y');if(w.endsWith('ied'))cand.push(w.slice(0,-3)+'y');if(w.endsWith('ing'))cand.push(w.slice(0,-3),w.slice(0,-3)+'e');if(w.endsWith('ed'))cand.push(w.slice(0,-2),w.slice(0,-1));if(w.endsWith('es'))cand.push(w.slice(0,-2),w.slice(0,-1));if(w.endsWith('s'))cand.push(w.slice(0,-1));return cand.find(x=>dict[x])||null}
function contextual(w,original){const txt=c().pages[page].en;const at=txt.toLowerCase().indexOf(original.toLowerCase());if(at<0)return '';const start=Math.max(0,txt.lastIndexOf('.',at-1)+1,txt.lastIndexOf('?',at-1)+1,txt.lastIndexOf('!',at-1)+1);let end=txt.slice(at).search(/[.!?]/);if(end<0)end=Math.min(txt.length-at,135);return txt.slice(start,at+end+1).trim().slice(0,170)}
function showGloss(w,type,original){const def=type==='phrase'?LEVEL3_PHRASES[w]:(type==='core'?bank[w]:extraBank[w]);const context=contextual(w,original);$('hint').innerHTML=`<span class="hint-title">${esc(original)}</span><span class="gloss-tag">${type==='core'?'三級目標詞':type==='phrase'?'補充片語':'閱讀輔助詞'}</span>${esc(def||'')}<br><span class="gloss-note">${esc(context)}</span><br><button id="hearWord" aria-label="朗讀英文">▶ 發音</button>`;$('hearWord').onclick=()=>speak(original)}
function highlight(s){let safe=esc(s);const reserved=[];for(const phrase of phrases){const re=new RegExp('\\b'+phrase.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');safe=safe.replace(re,t=>{const mark='ZZPHRASE'+reserved.length+'ZZ';reserved.push(`<button class="word extra phrase" data-type="phrase" data-word="${esc(phrase)}" type="button">${t}</button>`);return mark})}safe=safe.replace(/\b[A-Za-z]+(?:['’][A-Za-z]+)?\b/g,t=>{if(/^ZZPHRASE\d+ZZ$/.test(t))return t;const word=lemma(t);if(word&&chapterWord(word)){const own=c().words.includes(word);return `<button class="word${own?'':' old'}" data-type="core" data-word="${esc(word)}" type="button">${t}</button>`}const extra=glossKey(t,extraBank);if(extra&& (LEVEL3_GLOSSARY[extra] || LEVEL3_FOCUS_EXTRA.includes(extra) || (extra.length>=8 && advancedBank.has(extra))))return `<button class="word extra" data-type="extra" data-word="${esc(extra)}" type="button">${t}</button>`;return t});return safe.replace(/ZZPHRASE(\d+)ZZ/g,(_,i)=>reserved[+i])}
function art(scene){const night=scene==='night';let sky=night?'#24354a':scene==='paper'?'#736b75':scene==='meeting'?'#657f8b':'#7796ae';let lit=night?'#f4d18c':'#f9dfa7';return `<svg viewBox="0 0 360 124" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="124" fill="${sky}"/><rect y="0" width="360" height="11" fill="#282437"/><rect x="222" y="17" width="111" height="66" fill="#27243b"/><rect x="227" y="22" width="101" height="56" fill="${night?'#192638':'#c2dbe2'}"/><rect x="277" y="22" width="5" height="56" fill="#282437"/><rect y="80" width="360" height="44" fill="#74573e"/><rect y="84" width="360" height="3" fill="#342836"/><rect x="28" y="41" width="84" height="41" fill="#2c2535"/><rect x="33" y="46" width="74" height="31" fill="#e7e0d0"/><rect x="40" y="52" width="54" height="3" fill="#8c8478"/><rect x="40" y="61" width="40" height="3" fill="#ab9c81"/><rect x="40" y="69" width="49" height="3" fill="#8c8478"/><rect x="150" y="60" width="67" height="42" fill="#3b344c"/><rect x="155" y="65" width="57" height="32" fill="${night?'#3b5e6c':'#a8d5df'}"/><rect x="161" y="72" width="43" height="5" fill="#7699a3"/><rect x="161" y="81" width="32" height="5" fill="#506e79"/><rect x="138" y="100" width="90" height="6" fill="#281e2c"/><rect x="70" y="92" width="65" height="21" fill="#b59168"/><rect x="75" y="95" width="55" height="3" fill="#e1c59c"/><rect x="267" y="96" width="44" height="18" fill="#3b344c"/><rect x="273" y="99" width="32" height="12" fill="#ead6ad"/><rect x="300" y="13" width="3" height="10" fill="${lit}"/><rect x="293" y="22" width="18" height="4" fill="${lit}"/></svg>`}
function refreshTop(){stopVoice();$('count').textContent=`${c().series||"第一部 · 錯誤的地址"} · 第 ${chapter+1} / ${LEVEL3_STORIES.length} 章`;$('title').textContent=c().title;$('blurb').textContent=c().zh+'｜'+c().blurb;$('art').innerHTML=art(c().scene);const saved=getSaved();$('pick').innerHTML=LEVEL3_STORIES.map((s,i)=>`${i===0||LEVEL3_STORIES[i-1]?.series!==s.series?`<optgroup label="${esc(s.series||'第一部 · 錯誤的地址')}">`:''}<option value="${i}">${saved[s.id]?.score!==undefined?'✓ ':''}${String(i+1).padStart(2,'0')} · ${esc(s.title)}</option>${i===LEVEL3_STORIES.length-1||LEVEL3_STORIES[i+1]?.series!==s.series?'</optgroup>':''}`).join('');$('pick').value=chapter;let rec=saved[c().id];$('bReview').textContent=rec&&rec.next<=today()?'今日有複習':'隔日複習';$('bReview').disabled=!(rec&&rec.next<=today());}
function stopVoice(){if('speechSynthesis' in window)speechSynthesis.cancel()}
function showReader(){view='reader';refreshTop();$('reader').classList.remove('hide');$('quiz').classList.add('hide');$('review').classList.add('hide');$('progress').classList.remove('hide');$('translation').classList.toggle('hide',!translationOn);$('pageTag').textContent=`PAGE ${page+1} / ${c().pages.length}　·　第一次讀不必逐字查`;$('storyText').innerHTML=c().pages[page].en.split(/\n\s*\n/).map(x=>`<p class="en">${highlight(x)}</p>`).join('');$('translation').textContent=c().pages[page].zh;$('hint').innerHTML='<span class="hint-empty">先用上下文理解；點綠底線三級字、藍虛線補充字或片語可看中文。</span>';$('progress').innerHTML=c().pages.map((_,i)=>`<i class="${i<=page?'active':''}"></i>`).join('');$('bPrev').disabled=page===0;$('bNext').textContent=page===c().pages.length-1?'進入理解小考 →':'下一頁 →';$('storyText').querySelectorAll('.word').forEach(btn=>btn.addEventListener('click',()=>{btn.classList.add('visited');showGloss(btn.dataset.word,btn.dataset.type,btn.textContent)}))}
function speak(t){if(!('speechSynthesis' in window)){return}stopVoice();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;const voices=speechSynthesis.getVoices();const en=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(en)u.voice=en;speechSynthesis.speak(u)}
function renderQuiz(){view='quiz';stopVoice();$('reader').classList.add('hide');$('review').classList.add('hide');$('quiz').classList.remove('hide');$('progress').classList.add('hide');$('quizHead').textContent=`第 ${chapter+1} 章 · 劇情理解（${c().quiz.length} 題）`;$('quizItems').innerHTML=c().quiz.map((q,i)=>`<div class="qcard"><div class="qno">QUESTION ${i+1}</div><div class="qtitle">${esc(q.q)}</div><div class="answers">${q.opts.map((opt,j)=>`<button type="button" data-q="${i}" data-a="${j}" class="${answers[i]===j?'selected':''}">${String.fromCharCode(65+j)}. ${esc(opt)}</button>`).join('')}<button type="button" data-q="${i}" data-a="-1" class="${answers[i]===-1?'selected':''}">？ 我不知道（不猜）</button></div></div>`).join('');$('quizItems').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=+b.dataset.q,a=+b.dataset.a;answers[q]=a;document.querySelectorAll('[data-q=\"'+q+'\"]').forEach(x=>x.classList.toggle('selected',+x.dataset.a===a));$('bSubmit').disabled=answers.some(x=>x===null)});$('bSubmit').disabled=answers.some(x=>x===null)}
function saveQuiz(){const score=c().quiz.filter((q,i)=>answers[i]===q.a).length;const data=getSaved();const old=data[c().id]||{};data[c().id]={score,best:Math.max(old.best||0,score),date:today(),next:nextDate(),attempts:(old.attempts||0)+1,missed:c().quiz.map((q,i)=>answers[i]===q.a?null:i).filter(x=>x!==null)};setSaved(data)}
function showReview(retest=false){view='review';stopVoice();$('reader').classList.add('hide');$('quiz').classList.add('hide');$('review').classList.remove('hide');$('progress').classList.add('hide');const rec=getSaved()[c().id];$('reviewHead').textContent=`第 ${chapter+1} 章 · 故事解密與字彙`;let r=rec?`本次答對 ${rec.score} / ${c().quiz.length} · 下次複習 ${rec.next} · 累計練習 ${rec.attempts} 次`:'尚未作答';$('reviewStat').textContent=r;
  // 直接用既有每頁 zh 串成完整故事；逐段分段但不限制單頁，也不揭露後續章節。
  $('fullTranslation').innerHTML=c().pages.flatMap(p=>p.zh.trim().split(/\n\s*\n/)).map(para=>`<p>${esc(para.trim())}</p>`).join('');
  $('fullTranslation').classList.remove('hide');
  $('bFullTranslation').textContent='收起翻譯 ↑';
  $('bFullTranslation').setAttribute('aria-expanded','true');
  $('vocab').innerHTML=`<div class="qcard"><div class="qtitle">閱讀理解解析</div>${c().quiz.map((q,i)=>`<div class="answerwhy"><b>${i+1}. ${esc(q.q)}</b><br>正確答案：${esc(q.opts[q.a])}<br>${esc(q.why)}</div>`).join('')}</div><div class="sectionhead">本章核心字彙 · ${c().words.length} 個</div>`+c().words.map((word)=>{const example=c().pages.map(p=>p.en.split(/[.!?]\s+/).find(t=>new RegExp('\\b'+word.replace(/e$/,'')+'[a-z]*\\b','i').test(t))).find(Boolean)||'';return `<div class="vcard"><span class="w">${esc(word)}</span><button type="button" data-say="${esc(word)}">▶ 發音</button><div class="z">${esc(bank[word])}</div><div class="example">${esc(example.trim())}</div></div>`}).join('');// 補充詞與本章三級核心字分開計數，交卷後集中整理較難詞彙。
  const extras=new Map();for(const pg of c().pages){for(const m of pg.en.matchAll(/\b[A-Za-z]+(?:['’][A-Za-z]+)?\b/g)){const w=glossKey(m[0],extraBank);if(w&&!bank[w]&&(LEVEL3_GLOSSARY[w]||LEVEL3_FOCUS_EXTRA.includes(w)||(w.length>=8&&advancedBank.has(w))))extras.set(w,extraBank[w]);}}
  const supplemental=[...extras].slice(0,16);
  if(supplemental.length)$('vocab').innerHTML+=`<div class="sectionhead">閱讀補充難字 · 不計入三級詞數</div>`+supplemental.map(([w,z])=>`<div class="vcard"><span class="w">${esc(w)}</span><button type="button" data-say="${esc(w)}">▶ 發音</button><div class="z">${esc(z)}</div></div>`).join('');
  $('vocab').querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));$('bContinue').textContent=chapter<LEVEL3_STORIES.length-1?'下一章 →':'回第一章 ↻'}
$('bNext').onclick=()=>{if(page<c().pages.length-1){page++;showReader()}else{answers=Array(c().quiz.length).fill(null);renderQuiz()}};
$('bPrev').onclick=()=>{if(page>0){page--;showReader()}};
$('bSpeak').onclick=()=>speak(c().pages[page].en.replace(/\n+/g,' '));
$('bBack').onclick=()=>{page=c().pages.length-1;showReader()};
$('bSubmit').onclick=()=>{if(answers.some(x=>x===null))return;saveQuiz();showReview();refreshTop()};
$('bFullTranslation').onclick=()=>{
  const isOpen=$('bFullTranslation').getAttribute('aria-expanded')==='true';
  $('fullTranslation').classList.toggle('hide',isOpen);
  $('bFullTranslation').setAttribute('aria-expanded',String(!isOpen));
  $('bFullTranslation').textContent=isOpen?'展開完整中文 ↓':'收起翻譯 ↑';
};
$('bReread').onclick=()=>{page=0;translationOn=false;showReader()};
$('bContinue').onclick=()=>{chapter=(chapter+1)%LEVEL3_STORIES.length;page=0;translationOn=false;showReader()};
$('bReview').onclick=()=>{answers=Array(c().quiz.length).fill(null);renderQuiz()};
$('pick').onchange=e=>{chapter=+e.target.value;page=0;translationOn=false;showReader()};
// 翻譯在完成小考後才可開啟：在單字解密階段手動返回並查看本頁中文。
$('translation').classList.add('hide');
// 想看逐段中文時可在解密後重新閱讀；不破壞第一次閱讀的體驗。
const translationButton=document.createElement('button');translationButton.id='bTranslate';translationButton.textContent='本段中文（小考後）';translationButton.onclick=()=>{if(!getSaved()[c().id])return;translationOn=!translationOn;showReader()};$('bSpeak').after(translationButton);
const originalShowReader=showReader;showReader=function(){originalShowReader();translationButton.disabled=!getSaved()[c().id];$('translation').classList.toggle('hide',!translationOn)};
$('coverageInfo').textContent=`三級故事：${LEVEL3_STORIES.length} 章（${new Set(LEVEL3_STORIES.map(s=>s.series||"第一部")).size} 部） · 已故事化 ${introduced.size}／${Object.keys(bank).length} 個詞條；尚餘 ${Object.keys(bank).length-introduced.size} 個未故事化。部分系列已完結，不代表全級詞彙完成。`;
// ── 限時模式：每頁依字數倒數，小考依題數倒數；設定與其他頁共用 ──
(function(){
  const reportEl=()=>{let el=document.getElementById('tmReport');if(!el){el=document.createElement('span');el.id='tmReport';el.className='tm-report';$('reviewStat').appendChild(el)}return el};
  const timeUp=()=>{if(view!=='quiz'&&view!=='reader')return;if(!answers.length)answers=Array(c().quiz.length).fill(null);answers=answers.map(x=>x===null?-1:x);saveQuiz();showReview();refreshTop()};
  const baseReader=showReader;
  showReader=function(){baseReader();TimedMode.chapter(c().id);TimedMode.page(chapter+':'+page,TimedMode.countWords(c().pages[page].en),()=>$('bNext').click())};
  const baseQuiz=renderQuiz;
  renderQuiz=function(){baseQuiz();TimedMode.chapter(c().id);TimedMode.quiz(c().quiz.length,timeUp)};
  const baseReview=showReview;
  showReview=function(...a){const sum=TimedMode.finish();baseReview(...a);if(sum){const rec=getSaved()[c().id];reportEl().textContent=TimedMode.report(sum,rec?rec.score:0,c().quiz.length)}};
  TimedMode.mount({app:'level3',controlsAfter:document.querySelector('.toolbar'),stripBefore:$('progress'),onChange:()=>{if(view==='quiz')renderQuiz();else if(view==='reader')showReader()}});
})();
const data=getSaved();chapter=Math.max(0,LEVEL3_STORIES.findIndex(s=>data[s.id]?.score===undefined));page=0;showReader();
</script>
